# Local development only (Compose loads this automatically).
# Your ./app, ./web and ./migrations folders are used live inside the containers, so a code or
# page change needs only `docker compose restart worker` (or bot / api), not a rebuild.
# A rebuild is needed only when requirements.txt or the Dockerfile change.
# On a server, run `docker compose -f docker-compose.yml up -d` to ignore this file.
x-dev: &dev
  volumes:
    - ./app:/app/app
    - ./web:/app/web
    - ./migrations:/app/migrations
    - appdata:/data
    - ./cookies:/app/cookies:ro

services:
  api:
    <<: *dev
  bot:
    <<: *dev
  worker:
    <<: *dev
  migrate:
    <<: *dev
